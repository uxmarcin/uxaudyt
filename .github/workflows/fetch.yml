name: Pobierz fonty (jednorazowo)
on:
  push:
    branches: [fetch-assets]
jobs:
  fetch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - name: Fonty jak we Framerze
        run: |
          mkdir -p public/fonts/fr
          while read -r u; do [ -n "$u" ] && curl -sSL "$u" -o "public/fonts/fr/$(basename "$u")"; done < fonturls.txt
          ls -la public/fonts/fr
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/fonts/fr && git commit -qm "Fonty Figtree/DM Mono (pliki jak we Framerze)" && git push
