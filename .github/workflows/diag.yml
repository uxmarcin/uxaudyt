name: Sprawdzenie strony na serwerze
# Uruchamiane przy zmianie tego pliku. Porównuje stronę na serwerze cyber_Folks z wersją na Framerze
# (przed przepięciem DNS domena kierowana jest na IP serwera tylko w tej przeglądarce testowej).
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Adresy i nagłówki
        env: { S: "${{ secrets.FTP_SERVER }}" }
        run: |
          IP=$(getent ahostsv4 "$S" | awk 'NR==1{print $1}'); echo "IP=$IP" >> $GITHUB_ENV
          mkdir -p out; chk(){ curl -sk -o /dev/null -w "$1 -> %{http_code} %{redirect_url} %{size_download}B\n" --resolve "$2:$3:$IP" "$1" >> out/curl.txt; }
          chk http://uxaudyt.pl/ uxaudyt.pl 80
          chk http://www.uxaudyt.pl/audyt-ux www.uxaudyt.pl 80
          chk https://uxaudyt.pl/audyt-ux uxaudyt.pl 443
          chk https://www.uxaudyt.pl/ www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/index.html www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/audyt-ux www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/audyt-ux.html www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/audyt-ux/ www.uxaudyt.pl 443
          chk "https://www.uxaudyt.pl/zamowienie?pakiet=strona" www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/nie-ma-takiej www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/v7 www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/sitemap.xml www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/robots.txt www.uxaudyt.pl 443
          chk https://www.uxaudyt.pl/fonts/fonts.css www.uxaudyt.pl 443
          J=$(curl -sk --resolve www.uxaudyt.pl:443:$IP https://www.uxaudyt.pl/ | grep -o '/js/v7-[^"]*' | head -1)
          { curl -skI --resolve www.uxaudyt.pl:443:$IP -H 'Accept-Encoding: gzip, br' https://www.uxaudyt.pl/; curl -skI --resolve www.uxaudyt.pl:443:$IP -H 'Accept-Encoding: gzip, br' "https://www.uxaudyt.pl$J"; } > out/headers.txt
          { echo '## Serwer'; echo '```'; cat out/curl.txt; echo; grep -iE '^(HTTP|cache-control|content-encoding|content-type|x-)' out/headers.txt; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Obecne DNS (przed przepięciem)
        run: |
          { echo '## DNS'; echo '```'; for d in uxaudyt.pl creative-vision.pl; do for t in NS A AAAA MX TXT; do echo "$d $t: $(dig +short $d $t | tr '\n' ' ')"; done; echo "www.$d: $(dig +short www.$d | tr '\n' ' ')"; echo "_dmarc.$d: $(dig +short _dmarc.$d TXT | tr '\n' ' ')"; done; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Pomiary i zrzuty (serwer vs Framer)
        run: |
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cp $GITHUB_WORKSPACE/tools/probe.cjs $GITHUB_WORKSPACE/tools/shots.cjs .
          sed -i "s#const b = await chromium.launch();#const b = await chromium.launch(process.env.RULES ? { args: ['--host-resolver-rules=' + process.env.RULES, '--ignore-certificate-errors'] } : {});#" probe.cjs shots.cjs
          O=$GITHUB_WORKSPACE/out; R="MAP www.uxaudyt.pl $IP, MAP uxaudyt.pl $IP"
          node probe.cjs $O/probe-framer.json https://www.uxaudyt.pl
          RULES="$R" node probe.cjs $O/probe-server.json https://www.uxaudyt.pl
          { echo '## Różnice układu: Framer → serwer (ta sama maszyna)'; echo '```'; python3 $GITHUB_WORKSPACE/tools/probe-diff.py $O/probe-framer.json $O/probe-server.json | head -150; echo '```'; } >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with: { name: wyniki, path: out, retention-days: 3 }
