name: Diagnostyka serwera (ręcznie)
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/diag.yml"]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Sprawdź serwer i katalogi
        env:
          S: ${{ secrets.FTP_SERVER }}
          U: ${{ secrets.FTP_USERNAME }}
          P: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get install -y lftp >/dev/null 2>&1
          IP=$(getent ahostsv4 "$S" | awk 'NR==1{print $1}')
          DNS=$(getent ahostsv4 uxaudyt.pl | awk 'NR==1{print $1}'); LUM=$(getent ahostsv4 lumioagency.pl | awk 'NR==1{print $1}')
          {
            echo "## Serwer"; echo "- IP serwera FTP: \`$IP\`"; echo "- IP lumioagency.pl: \`$LUM\`"; echo "- IP uxaudyt.pl (DNS, Framer): \`$DNS\`"
            echo "## Katalogi FTP"; echo '```'
            lftp -c "set ftp:ssl-force true; set ssl:verify-certificate no; open -u \"$U\",\"$P\" $S; echo '[public_html - ls -la]'; ls -la public_html/; echo '[private_html]'; ls -la private_html; echo '[public_html subdirs]'; cls -1 public_html/*/ | head -60" 2>&1 | sed "s/$U/<login>/g"
            echo '```'
            echo "## Strona z serwera FTP (Host: www.uxaudyt.pl)"; echo '```'
            for u in / /audyt-ux /fonts/fonts.css; do curl -sk -o /tmp/o -w "$u -> %{http_code} %{size_download}B\n" --resolve www.uxaudyt.pl:443:$IP "https://www.uxaudyt.pl$u"; done
            curl -sk --resolve www.uxaudyt.pl:443:$IP https://www.uxaudyt.pl/ | grep -o '<title>[^<]*' | head -1
            echo '```'
          } >> $GITHUB_STEP_SUMMARY
