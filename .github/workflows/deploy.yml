name: Wdrożenie na cyber_Folks (FTPS)

# Każdy push na main wysyła katalog public/ do domains/uxaudyt.pl/public_html/
# Sekrety repo: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (te same co w lumio)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sekret FTP_SERVER ustawiony
        run: test -n "${{ secrets.FTP_SERVER }}"
      - name: Sekret FTP_USERNAME ustawiony
        run: test -n "${{ secrets.FTP_USERNAME }}"
      - name: Sekret FTP_PASSWORD ustawiony
        run: test -n "${{ secrets.FTP_PASSWORD }}"
      - name: Logowanie FTPS działa
        run: curl -sS --ssl-reqd -k --max-time 30 -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/" -l > /tmp/root.txt
      - name: Katalog domains/uxaudyt.pl istnieje
        run: curl -sS --ssl-reqd -k --max-time 30 -u "${{ secrets.FTP_USERNAME }}:${{ secrets.FTP_PASSWORD }}" "ftp://${{ secrets.FTP_SERVER }}/domains/" -l | tee /tmp/d.txt | grep -qx 'uxaudyt.pl'
      - name: Wyślij public/ przez FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          local-dir: ./public/
          server-dir: ./domains/uxaudyt.pl/public_html/
