name: Wdrożenie na cyber_Folks (FTPS)

# Każdy push na main wysyła katalog public/ do domains/uxaudyt.pl/public_html/
# Sekrety repo: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (te same co w lumio)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wyślij public/ przez FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./domains/uxaudyt.pl/public_html/
