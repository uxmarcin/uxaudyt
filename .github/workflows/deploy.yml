name: Wdrożenie na cyber_Folks (FTPS)

# Każdy push na main wysyła katalog public/ do public_html/ (HTTP) i private_html/ (HTTPS) konta uxaudyt.pl
# Sekrety repo: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD (te same co w lumio)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sekret FTP_SERVER ustawiony
        run: test -n "${{ secrets.FTP_SERVER }}"
      - name: Sekret FTP_USERNAME ustawiony
        run: test -n "${{ secrets.FTP_USERNAME }}"
      - name: Sekret FTP_PASSWORD ustawiony
        run: test -n "${{ secrets.FTP_PASSWORD }}"
      - name: Wyślij do public_html (HTTP)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./public_html/
      - name: Wyślij do private_html (HTTPS)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./public/
          server-dir: ./private_html/
